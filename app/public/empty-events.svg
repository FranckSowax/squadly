    <rect x="358" y="112" width="16" height="10" rx="5" fill="#EDF6EF"/>
    <rect x="310" y="130" width="16" height="10" rx="5" fill="#EDF6EF"/>
    <rect x="334" y="130" width="16" height="10" rx="5" fill="#FFC53D"/>
  </g>
  <!-- pelouse -->
