<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- Motif lignes de terrain vu de dessus — tuile sans couture, blanc 6 % -->
  <g stroke="#FFFFFF" stroke-opacity=".06" stroke-width="3">
    <!-- cadre -->
    <rect x="40" y="40" width="720" height="720" rx="4"/>
    <!-- ligne médiane -->
    <line x1="40" y1="400" x2="760" y2="400"/>
    <!-- cercle central -->
    <circle cx="400" cy="400" r="110"/>
    <circle cx="400" cy="400" r="5" fill="#FFFFFF" fill-opacity=".06" stroke="none"/>
    <!-- surface de réparation haut -->
    <rect x="220" y="40" width="360" height="150"/>
    <rect x="310" y="40" width="180" height="60"/>
    <!-- surface de réparation bas -->
    <rect x="220" y="610" width="360" height="150"/>
    <rect x="310" y="700" width="180" height="60"/>
    <!-- arcs de cercle devant les surfaces -->
    <path d="M335 190a82 82 0 0 0 130 0"/>
    <path d="M335 610a82 82 0 0 1 130 0"/>
    <!-- coins -->
    <path d="M40 66a26 26 0 0 0 26 -26"/>
    <path d="M734 40a26 26 0 0 0 26 26"/>
    <path d="M40 734a26 26 0 0 1 26 26"/>
    <path d="M734 760a26 26 0 0 1 26 -26"/>
  </g>
</svg>
