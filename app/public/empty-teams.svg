<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <!-- Spot : trois maillots sur cintres + sifflet -->
  <circle cx="240" cy="190" r="128" fill="#EDF6EF"/>
  <!-- tringle -->
  <line x1="96" y1="104" x2="384" y2="104" stroke="#0C2B1C" stroke-opacity=".25" stroke-width="6" stroke-linecap="round"/>
  <!-- maillot 1 (pitch) -->
  <g>
    <path d="M164 104a14 14 0 0 1 28 0" stroke="#0C2B1C" stroke-opacity=".4" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M178 104v10" stroke="#0C2B1C" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/>
    <path d="M156 118h44l16 14-10 18-10-8v66a8 8 0 0 1-8 8h-20a8 8 0 0 1-8-8v-66l-10 8-10-18 16-14Z" fill="#16A34A"/>
    <rect x="168" y="150" width="20" height="20" rx="6" fill="#A3E635"/>
  </g>
  <!-- maillot 2 (blanc) -->
  <g>
    <path d="M226 104a14 14 0 0 1 28 0" stroke="#0C2B1C" stroke-opacity=".4" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M240 104v10" stroke="#0C2B1C" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/>
    <path d="M218 118h44l16 14-10 18-10-8v66a8 8 0 0 1-8 8h-20a8 8 0 0 1-8-8v-66l-10 8-10-18 16-14Z" fill="#FFFFFF" stroke="#E4E9E1" stroke-width="3"/>
    <path d="M230 138h20" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- maillot 3 (sun) -->
  <g>
    <path d="M288 104a14 14 0 0 1 28 0" stroke="#0C2B1C" stroke-opacity=".4" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M302 104v10" stroke="#0C2B1C" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/>
    <path d="M280 118h44l16 14-10 18-10-8v66a8 8 0 0 1-8 8h-20a8 8 0 0 1-8-8v-66l-10 8-10-18 16-14Z" fill="#FFC53D"/>
    <circle cx="302" cy="160" r="9" fill="#FFFFFF"/>
  </g>
  <!-- sifflet posé -->
  <g transform="translate(196 264) rotate(-8)">
    <rect x="0" y="0" width="88" height="40" rx="20" fill="#0C2B1C"/>
    <rect x="70" y="8" width="30" height="14" rx="7" fill="#0C2B1C"/>
    <circle cx="26" cy="20" r="10" fill="#A3E635"/>
    <path d="M-14 8c-8 2-12 8-12 14" stroke="#16A34A" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- étincelles -->
  <path d="M120 250l0 12m-6-6h12" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/>
  <path d="M366 236l0 12m-6-6h12" stroke="#FFC53D" stroke-width="5" stroke-linecap="round"/>
</svg>
