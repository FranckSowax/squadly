  <!-- bulle entrante (arrière) -->
  <g transform="rotate(6 180 150)">
    <rect x="104" y="96" width="168" height="104" rx="24" fill="#FFFFFF" stroke="#E4E9E1" stroke-width="3"/>
    <path d="M132 200l-2 26c-.3 3 3.2 4.4 5 2l19-24" fill="#FFFFFF" stroke="#E4E9E1" stroke-width="3"/>
    <rect x="128" y="122" width="96" height="12" rx="6" fill="#EDF6EF"/>
    <rect x="128" y="150" width="120" height="12" rx="6" fill="#EDF6EF"/>
  </g>
